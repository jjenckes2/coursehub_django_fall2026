{% extends "core/base.html" %}

{% block title %}{{ page_title }} | CourseHub{% endblock %}

{% block content %}
    <h1>{{ page_title }}</h1>
    <p>{{description}}</p>
    <ul>
        {% for item in items %}
            <li>{{ item }}</li>
        {% empty %}
            <li>Nothing Listed</li>
        {% endfor %}
    </ul>
{% endblock %}
