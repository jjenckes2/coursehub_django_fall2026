{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CourseHub{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'core/css/site.css' %}">
  <script src="{% static 'core/js/site.js' %}" defer></script>
</head>
<body>
  <header>
    <p class="site-name">CourseHub</p>
    {% include "core/includes/nav.html" %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    {% include "core/includes/footer.html" %}
  </footer>
</body>
</html>
