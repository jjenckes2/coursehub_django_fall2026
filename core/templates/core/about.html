{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }} | CourseHub</title>
  <link rel="stylesheet" href="{% static 'core/css/site.css' %}">
  <script src="{% static 'core/js/site.js' %}" defer></script>
</head>
<body>
  <header>
    <p class="site-name">CourseHub</p>
    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/assignments">Assignments</a>
      <a href="/resources">Resources</a>
    </nav>
  </header>
  <main>
    <!--add here -->
    <h1>{{ page_title }}</h1>

    <h2>Who uses CourseHub</h2>
    <ul>
      {% for item in items %}
        <li>{{ item }}</li>
      {% empty %}
        <li>No users yet</li>
      {% endfor %}
    </ul>

  </main>
</body>
</html>
